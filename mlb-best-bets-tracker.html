<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB Best Bets Tracker - 2026 Season</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f1117; color: #e1e4e8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; padding: 30px 0; border-bottom: 1px solid #21262d; margin-bottom: 30px; }
        header h1 { font-size: 2.2em; background: linear-gradient(135deg, #58a6ff, #3fb950); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 8px; }
        header .subtitle { color: #8b949e; font-size: 1.1em; }
        .stats-banner { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: #161b22; border: 1px solid #21262d; border-radius: 10px; padding: 20px; text-align: center; }
        .stat-card .value { font-size: 2em; font-weight: 700; color: #58a6ff; }
        .stat-card .label { font-size: 0.85em; color: #8b949e; margin-top: 4px; }
        .stat-card.wins .value { color: #3fb950; }
        .stat-card.losses .value { color: #f85149; }
        .stat-card.pct .value { color: #d2a8ff; }
        .stat-card.streak .value { color: #f0883e; }
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; border-bottom: 1px solid #21262d; }
        .tab { padding: 10px 20px; cursor: pointer; background: transparent; border: none; color: #8b949e; font-size: 0.95em; border-bottom: 2px solid transparent; transition: all 0.2s; }
        .tab:hover { color: #e1e4e8; }
        .tab.active { color: #58a6ff; border-bottom-color: #58a6ff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .day-section { background: #161b22; border: 1px solid #21262d; border-radius: 10px; margin-bottom: 20px; }
        .day-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #1c2128; border-bottom: 1px solid #21262d; cursor: pointer; user-select: none; transition: background 0.2s; }
        .day-header:hover { background: #22272e; }
        .day-header h3 { font-size: 1.1em; }
        .day-header .chevron { font-size: 1.2em; color: #8b949e; transition: transform 0.3s ease; margin-left: 12px; }
        .day-section.collapsed .day-header .chevron { transform: rotate(-90deg); }
        .day-section.collapsed .day-body { display: none; }
        .day-section.collapsed .day-header { border-bottom: none; }
        .day-record { display: flex; gap: 15px; font-size: 0.9em; align-items: center; }
        .day-record .w { color: #3fb950; font-weight: 600; }
        .day-record .l { color: #f85149; font-weight: 600; }
        .day-record .p { color: #8b949e; }
        .day-record .pnl { font-weight: 700; }
        .day-body { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .picks-table { width: 100%; border-collapse: collapse; min-width: 750px; }
        .picks-table th { text-align: left; padding: 10px 15px; color: #8b949e; font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #21262d; white-space: nowrap; }
        .picks-table td { padding: 12px 15px; border-bottom: 1px solid #21262d; font-size: 0.9em; white-space: nowrap; }
        .picks-table tr:last-child td { border-bottom: none; }
        .picks-table tr.row-win { background: rgba(52,211,153,0.06); border-left: 4px solid #3fb950; }
        .picks-table tr.row-loss { background: rgba(248,113,113,0.06); border-left: 4px solid #f85149; }
        .picks-table tr.row-pending { border-left: 4px solid transparent; }
        .pick-type { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.8em; font-weight: 600; }
        .pick-type.ml { background: #1f3a5f; color: #58a6ff; }
        .pick-type.over { background: #1a4023; color: #3fb950; }
        .pick-type.under { background: #3d1f20; color: #f85149; }
        .result { display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 0.8em; font-weight: 700; }
        .result.win { background: #1a4023; color: #3fb950; }
        .result.loss { background: #3d1f20; color: #f85149; }
        .result.push { background: #2d2a1f; color: #d29922; }
        .result.pending { background: #21262d; color: #8b949e; }
        .pnl-cell { font-weight: 700; font-size: 0.9em; }
        .pnl-cell.win { color: #3fb950; }
        .pnl-cell.loss { color: #f85149; }
        .confidence { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 0.75em; }
        .confidence.high { background: #1a4023; color: #3fb950; }
        .confidence.med { background: #2d2a1f; color: #d29922; }
        .chart-container { background: #161b22; border: 1px solid #21262d; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .chart-container h3 { margin-bottom: 15px; color: #58a6ff; }
        .chart-bar-container { display: flex; align-items: center; margin-bottom: 8px; gap: 10px; }
        .chart-label { width: 80px; font-size: 0.85em; color: #8b949e; text-align: right; }
        .chart-bar-bg { flex: 1; height: 24px; background: #21262d; border-radius: 4px; overflow: hidden; }
        .chart-bar { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
        .chart-bar.green { background: linear-gradient(90deg, #238636, #3fb950); }
        .chart-bar.red { background: linear-gradient(90deg, #9e1c23, #f85149); }
        .chart-bar.blue { background: linear-gradient(90deg, #1f3a5f, #58a6ff); }
        .chart-value { width: 80px; font-size: 0.85em; color: #e1e4e8; }
        .btn { padding: 8px 20px; background: #238636; color: #fff; border: none; border-radius: 6px; font-size: 0.9em; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn:hover { background: #2ea043; }
        .btn:disabled { background: #374151; color: #6b7280; cursor: not-allowed; }
        footer { text-align: center; padding: 20px; color: #6e7681; font-size: 0.85em; border-top: 1px solid #21262d; margin-top: 30px; }
        .nav-links { text-align: center; margin-top: 24px; padding-top: 16px; border-top: 1px solid #21262d; }
        .nav-links a { color: #58a6ff; text-decoration: none; margin: 0 12px; font-size: 0.9em; }
        .loading { text-align: center; padding: 40px; color: #8b949e; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>MLB Best Bets Tracker</h1>
            <p class="subtitle">2026 Season | Model: Ensemble v2.1</p>
            <button class="btn" id="refresh-btn" onclick="refreshResults()" style="margin-top:12px">Refresh Results</button>
        </header>

        <div class="stats-banner" id="stats-banner"><div class="loading">Loading...</div></div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('daily')">Daily Picks</button>
            <button class="tab" onclick="switchTab('performance')">Performance</button>
            <button class="tab" onclick="switchTab('streaks')">Streaks & Trends</button>
        </div>

        <div class="tab-content active" id="tab-daily"><div class="loading">Loading...</div></div>
        <div class="tab-content" id="tab-performance"></div>
        <div class="tab-content" id="tab-streaks"></div>

        <div class="nav-links">
            <a href="/">Daily Picks</a>
            <a href="/early">Early Action</a>
            <a href="/nba">NBA</a>
            <a href="/tracker">Betting Tracker</a>
        </div>

        <footer>MLB Best Bets Tracker | Data: ESPN + MLB Stats API | Model: Ensemble v2.1</footer>
    </div>

    <script>
    let PICKS_DATA = [];

    function calcPnl(pick) {
        if (pick.result === 'pending' || pick.result === 'push') return 0;
        const odds = parseInt(pick.odds || pick.line?.match(/([+-]\d+)/)?.[1]) || -110;
        const stake = pick.stake || 25;
        if (pick.result === 'win') return odds > 0 ? (stake * odds / 100) : (stake * 100 / Math.abs(odds));
        return -stake;
    }

    function formatPnl(val) {
        if (val === 0) return '—';
        return (val >= 0 ? '+' : '') + '$' + val.toFixed(2);
    }

    function calculateStats() {
        let wins = 0, losses = 0, pushes = 0, pending = 0;
        let mlWins = 0, mlTotal = 0, ouWins = 0, ouTotal = 0;
        let totalPnl = 0;
        let currentStreak = { type: null, count: 0 };

        const allResults = [];
        for (const day of PICKS_DATA) {
            for (const pick of day.picks) {
                if (pick.result === 'win') { wins++; allResults.push('W'); totalPnl += calcPnl(pick); }
                else if (pick.result === 'loss') { losses++; allResults.push('L'); totalPnl += calcPnl(pick); }
                else if (pick.result === 'push') { pushes++; }
                else { pending++; }

                if (pick.result === 'win' || pick.result === 'loss') {
                    if (pick.type === 'ml') { mlTotal++; if (pick.result === 'win') mlWins++; }
                    else { ouTotal++; if (pick.result === 'win') ouWins++; }
                }
            }
        }

        for (const r of allResults) {
            if (currentStreak.type === null) { currentStreak = { type: r, count: 1 }; }
            else if (r === currentStreak.type) { currentStreak.count++; }
            else { break; }
        }

        const total = wins + losses;
        const winPct = total > 0 ? ((wins / total) * 100).toFixed(1) : '0.0';
        const mlPct = mlTotal > 0 ? ((mlWins / mlTotal) * 100).toFixed(1) : '0.0';
        const ouPct = ouTotal > 0 ? ((ouWins / ouTotal) * 100).toFixed(1) : '0.0';

        return { wins, losses, pushes, pending, winPct, mlWins, mlTotal, mlPct, ouWins, ouTotal, ouPct, currentStreak, totalPnl };
    }

    function renderStats() {
        const s = calculateStats();
        const streakText = s.currentStreak.type ? s.currentStreak.type + s.currentStreak.count : '—';
        const pnlCls = s.totalPnl >= 0 ? 'wins' : 'losses';

        document.getElementById('stats-banner').innerHTML = `
            <div class="stat-card wins"><div class="value">${s.wins}</div><div class="label">Wins</div></div>
            <div class="stat-card losses"><div class="value">${s.losses}</div><div class="label">Losses</div></div>
            <div class="stat-card pct"><div class="value">${s.winPct}%</div><div class="label">Win Rate</div></div>
            <div class="stat-card ${pnlCls}"><div class="value">${formatPnl(s.totalPnl)}</div><div class="label">Total P&L</div></div>
            <div class="stat-card"><div class="value">${s.mlPct}%</div><div class="label">ML (${s.mlWins}-${s.mlTotal - s.mlWins})</div></div>
            <div class="stat-card streak"><div class="value">${streakText}</div><div class="label">Streak</div></div>
        `;
    }

    function renderDaily() {
        let html = '';

        for (let i = 0; i < PICKS_DATA.length; i++) {
            const day = PICKS_DATA[i];
            const dayWins = day.picks.filter(p => p.result === 'win').length;
            const dayLosses = day.picks.filter(p => p.result === 'loss').length;
            const dayPending = day.picks.filter(p => p.result === 'pending').length;
            let dayPnl = 0;
            day.picks.forEach(p => { dayPnl += calcPnl(p); });
            const collapsed = i > 0 ? 'collapsed' : '';

            const dateStr = new Date(day.date + 'T12:00:00').toLocaleDateString('en-US', {
                weekday: 'long', month: 'short', day: 'numeric'
            });

            const pnlCls = dayPnl >= 0 ? 'w' : 'l';
            const pnlDisplay = (dayWins + dayLosses === 0) ? '' : formatPnl(dayPnl);

            html += '<div class="day-section ' + collapsed + '" id="day-' + day.date + '">';
            html += '<div class="day-header" onclick="toggleDay(\'' + day.date + '\')">';
            html += '<h3>' + dateStr + '</h3>';
            html += '<div class="day-record">';
            html += '<span class="w">' + dayWins + 'W</span>';
            html += '<span class="l">' + dayLosses + 'L</span>';
            if (dayPending > 0) html += '<span class="p">' + dayPending + ' pending</span>';
            if (pnlDisplay) html += '<span class="pnl ' + pnlCls + '">' + pnlDisplay + '</span>';
            html += '<span class="chevron">&#9660;</span>';
            html += '</div></div>';
            html += '<div class="day-body"><table class="picks-table"><thead><tr>';
            html += '<th>Type</th><th>Pick</th><th>Matchup</th><th>Line</th><th>Win%</th><th>Conf</th><th>Score</th><th>Result</th><th>P&L</th>';
            html += '</tr></thead><tbody>';

            for (const p of day.picks) {
                const pnl = calcPnl(p);
                const rowCls = p.result === 'win' ? 'row-win' : p.result === 'loss' ? 'row-loss' : 'row-pending';
                const typeLabel = p.type === 'ml' ? 'ML' : p.type.toUpperCase();
                const typeCls = p.type === 'ml' ? 'ml' : p.type.includes('over') ? 'over' : p.type.includes('under') ? 'under' : 'ml';
                const line = p.line || (p.odds ? ((parseInt(p.odds) > 0 ? '+' : '') + p.odds) : '—');

                html += '<tr class="' + rowCls + '">';
                html += '<td><span class="pick-type ' + typeCls + '">' + typeLabel + '</span></td>';
                html += '<td><strong>' + (p.team || '—') + '</strong></td>';
                html += '<td>' + (p.matchup || '—') + '</td>';
                html += '<td>' + line + '</td>';
                html += '<td>' + (p.winProb ? p.winProb.toFixed(1) + '%' : '—') + '</td>';
                html += '<td><span class="confidence ' + (p.confidence || 'med') + '">' + (p.confidence || '—') + '</span></td>';
                html += '<td>' + (p.score || '—') + '</td>';
                html += '<td><span class="result ' + p.result + '">' + (p.result === 'win' ? 'WIN' : p.result === 'loss' ? 'LOSS' : p.result === 'push' ? 'PUSH' : 'PEND') + '</span></td>';
                html += '<td class="pnl-cell ' + (pnl >= 0 && p.result !== 'pending' ? 'win' : pnl < 0 ? 'loss' : '') + '">' + (p.result === 'pending' ? '—' : formatPnl(pnl)) + '</td>';
                html += '</tr>';
            }

            html += '</tbody></table></div></div>';
        }

        document.getElementById('tab-daily').innerHTML = html || '<div class="loading">No picks data available</div>';
    }

    function toggleDay(date) {
        document.getElementById('day-' + date).classList.toggle('collapsed');
    }

    function renderPerformance() {
        const s = calculateStats();
        const total = s.wins + s.losses;

        let html = '<div class="chart-container"><h3>Overall Record</h3>';
        html += '<div class="chart-bar-container"><div class="chart-label">Wins</div><div class="chart-bar-bg"><div class="chart-bar green" style="width:' + (total > 0 ? (s.wins/total)*100 : 0) + '%"></div></div><div class="chart-value">' + s.wins + '</div></div>';
        html += '<div class="chart-bar-container"><div class="chart-label">Losses</div><div class="chart-bar-bg"><div class="chart-bar red" style="width:' + (total > 0 ? (s.losses/total)*100 : 0) + '%"></div></div><div class="chart-value">' + s.losses + '</div></div>';
        html += '</div>';

        html += '<div class="chart-container"><h3>By Pick Type</h3>';
        html += '<div class="chart-bar-container"><div class="chart-label">Moneyline</div><div class="chart-bar-bg"><div class="chart-bar blue" style="width:' + (s.mlTotal > 0 ? (s.mlWins/s.mlTotal)*100 : 0) + '%"></div></div><div class="chart-value">' + s.mlWins + '-' + (s.mlTotal-s.mlWins) + ' (' + s.mlPct + '%)</div></div>';
        html += '<div class="chart-bar-container"><div class="chart-label">Over/Under</div><div class="chart-bar-bg"><div class="chart-bar blue" style="width:' + (s.ouTotal > 0 ? (s.ouWins/s.ouTotal)*100 : 0) + '%"></div></div><div class="chart-value">' + s.ouWins + '-' + (s.ouTotal-s.ouWins) + ' (' + s.ouPct + '%)</div></div>';
        html += '</div>';

        // Confidence breakdown
        const conf = { high: { w: 0, l: 0 }, med: { w: 0, l: 0 } };
        for (const day of PICKS_DATA) {
            for (const pick of day.picks) {
                const c = pick.confidence || 'med';
                if (pick.result === 'win') conf[c] = conf[c] || { w: 0, l: 0 }, conf[c].w++;
                else if (pick.result === 'loss') conf[c] = conf[c] || { w: 0, l: 0 }, conf[c].l++;
            }
        }

        html += '<div class="chart-container"><h3>By Confidence</h3>';
        for (const level of ['high', 'med']) {
            const c = conf[level] || { w: 0, l: 0 };
            const t = c.w + c.l;
            const pct = t > 0 ? ((c.w / t) * 100).toFixed(0) : 0;
            html += '<div class="chart-bar-container"><div class="chart-label">' + level.charAt(0).toUpperCase() + level.slice(1) + '</div><div class="chart-bar-bg"><div class="chart-bar green" style="width:' + pct + '%"></div></div><div class="chart-value">' + c.w + '-' + c.l + ' (' + pct + '%)</div></div>';
        }
        html += '</div>';

        document.getElementById('tab-performance').innerHTML = html;
    }

    function renderStreaks() {
        let html = '<div class="chart-container"><h3>Daily Results</h3>';
        for (const day of PICKS_DATA) {
            const dayW = day.picks.filter(p => p.result === 'win').length;
            const dayL = day.picks.filter(p => p.result === 'loss').length;
            const dayT = dayW + dayL;
            if (dayT === 0) continue;
            const pct = ((dayW / dayT) * 100).toFixed(0);
            const dateLabel = new Date(day.date + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            html += '<div class="chart-bar-container"><div class="chart-label">' + dateLabel + '</div><div class="chart-bar-bg"><div class="chart-bar ' + (parseInt(pct) >= 50 ? 'green' : 'red') + '" style="width:' + pct + '%"></div></div><div class="chart-value">' + dayW + '-' + dayL + '</div></div>';
        }
        html += '</div>';
        document.getElementById('tab-streaks').innerHTML = html;
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelector('[onclick="switchTab(\'' + tab + '\')"]').classList.add('active');
        document.getElementById('tab-' + tab).classList.add('active');
    }

    async function loadData() {
        try {
            const res = await fetch('/api/bestbets');
            const data = await res.json();
            if (data.days && data.days.length > 0) {
                PICKS_DATA = data.days;
            }
        } catch (e) {}

        renderStats();
        renderDaily();
        renderPerformance();
        renderStreaks();
    }

    async function refreshResults() {
        const btn = document.getElementById('refresh-btn');
        btn.textContent = 'Grading...';
        btn.disabled = true;
        try {
            await fetch('/api/grade', { method: 'POST' });
            await loadData();
            btn.textContent = 'Updated!';
            setTimeout(() => { btn.textContent = 'Refresh Results'; btn.disabled = false; }, 2000);
        } catch (e) {
            btn.textContent = 'Error';
            setTimeout(() => { btn.textContent = 'Refresh Results'; btn.disabled = false; }, 2000);
        }
    }

    loadData();
    </script>
</body>
</html>
