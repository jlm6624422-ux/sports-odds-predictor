<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>MLB Best Bets Tracker - 2026 Season</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0f1117;
            color: #e1e4e8;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid #21262d;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.2em;
            background: linear-gradient(135deg, #58a6ff, #3fb950);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        header .subtitle { color: #8b949e; font-size: 1.1em; }

        /* Stats Banner */
        .stats-banner {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #161b22;
            border: 1px solid #21262d;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .stat-card .value {
            font-size: 2em;
            font-weight: 700;
            color: #58a6ff;
        }

        .stat-card .label {
            font-size: 0.85em;
            color: #8b949e;
            margin-top: 4px;
        }

        .stat-card.wins .value { color: #3fb950; }
        .stat-card.losses .value { color: #f85149; }
        .stat-card.pct .value { color: #d2a8ff; }
        .stat-card.streak .value { color: #f0883e; }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            border-bottom: 1px solid #21262d;
            padding-bottom: 0;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            background: transparent;
            border: none;
            color: #8b949e;
            font-size: 0.95em;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab:hover { color: #e1e4e8; }
        .tab.active { color: #58a6ff; border-bottom-color: #58a6ff; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Day Section */
        .day-section {
            background: #161b22;
            border: 1px solid #21262d;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #1c2128;
            border-bottom: 1px solid #21262d;
            cursor: pointer;
        }

        .day-header h3 { font-size: 1.1em; }

        .day-record {
            display: flex;
            gap: 15px;
            font-size: 0.9em;
        }

        .day-record .w { color: #3fb950; }
        .day-record .l { color: #f85149; }
        .day-record .p { color: #8b949e; }

        /* Picks Table */
        .picks-table {
            width: 100%;
            border-collapse: collapse;
        }

        .picks-table th {
            text-align: left;
            padding: 10px 15px;
            color: #8b949e;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid #21262d;
        }

        .picks-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #21262d;
            font-size: 0.9em;
        }

        .picks-table tr:last-child td { border-bottom: none; }

        .pick-type {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .pick-type.ml { background: #1f3a5f; color: #58a6ff; }
        .pick-type.over { background: #1a4023; color: #3fb950; }
        .pick-type.under { background: #3d1f20; color: #f85149; }

        .result {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: 700;
        }

        .result.win { background: #1a4023; color: #3fb950; }
        .result.loss { background: #3d1f20; color: #f85149; }
        .result.push { background: #2d2a1f; color: #d29922; }
        .result.pending { background: #21262d; color: #8b949e; }

        .confidence {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.75em;
        }

        .confidence.high { background: #1a4023; color: #3fb950; }
        .confidence.med { background: #2d2a1f; color: #d29922; }
        .confidence.low { background: #21262d; color: #8b949e; }

        /* Chart placeholder */
        .chart-container {
            background: #161b22;
            border: 1px solid #21262d;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .chart-container h3 {
            margin-bottom: 15px;
            color: #58a6ff;
        }

        .chart-bar-container {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            gap: 10px;
        }

        .chart-label {
            width: 80px;
            font-size: 0.85em;
            color: #8b949e;
            text-align: right;
        }

        .chart-bar-bg {
            flex: 1;
            height: 24px;
            background: #21262d;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .chart-bar {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .chart-bar.green { background: linear-gradient(90deg, #238636, #3fb950); }
        .chart-bar.red { background: linear-gradient(90deg, #9e1c23, #f85149); }
        .chart-bar.blue { background: linear-gradient(90deg, #1f3a5f, #58a6ff); }

        .chart-value {
            width: 50px;
            font-size: 0.85em;
            color: #e1e4e8;
        }

        /* Footer */

            text-align: center;
            padding: 20px;
            color: #6e7681;
            font-size: 0.85em;
            border-top: 1px solid #21262d;
            margin-top: 30px;
        }
    </style>

    // RENDERING LOGIC

    function calculateStats() {
        let wins = 0, losses = 0, pushes = 0, pending = 0;
        let mlWins = 0, mlTotal = 0, ouWins = 0, ouTotal = 0;
        let currentStreak = { type: null, count: 0 };
        let bestStreak = 0;

        // Process all picks across all days (newest first)
        const allResults = [];
        for (const day of PICKS_DATA) {
            for (const pick of day.picks) {
                if (pick.result === "win") { wins++; allResults.push("W"); }
                else if (pick.result === "loss") { losses++; allResults.push("L"); }
                else if (pick.result === "push") { pushes++; }
                else { pending++; }

                if (pick.result === "win" || pick.result === "loss") {
                    if (pick.type === "ml") { mlTotal++; if (pick.result === "win") mlWins++; }
                    else { ouTotal++; if (pick.result === "win") ouWins++; }
                }
            }
        }

        // Calculate streak (from most recent resolved pick)
        for (const r of allResults) {
            if (currentStreak.type === null) { currentStreak = { type: r, count: 1 }; }
            else if (r === currentStreak.type) { currentStreak.count++; }
            else { break; }
        }

        const total = wins + losses;
        const winPct = total > 0 ? ((wins / total) * 100).toFixed(1) : "0.0";
        const mlPct = mlTotal > 0 ? ((mlWins / mlTotal) * 100).toFixed(1) : "0.0";
        const ouPct = ouTotal > 0 ? ((ouWins / ouTotal) * 100).toFixed(1) : "0.0";

        return { wins, losses, pushes, pending, winPct, mlWins, mlTotal, mlPct, ouWins, ouTotal, ouPct, currentStreak };
    }

            <div class="stat-card"><div class="value">${s.ouPct}%</div><div class="label">O/U Record (${s.ouWins}-${s.ouTotal - s.ouWins})</div></div>
            <div class="stat-card streak"><div class="value">${streakText}</div><div class="label">Streak</div></div>
        `;
    }

    function renderPerformance() {
        const s = calculateStats();

                <div class="chart-value">${s.mlWins}-${s.mlTotal - s.mlWins} (${s.mlPct}%)</div>
            </div>
            <div class="chart-bar-container">
                <div class="chart-label">Over/Under</div>
                <div class="chart-bar-bg"><div class="chart-bar blue" style="width: ${s.ouTotal > 0 ? (s.ouWins/s.ouTotal)*100 : 0}%"></div></div>
                <div class="chart-value">${s.ouWins}-${s.ouTotal - s.ouWins} (${s.ouPct}%)</div>
            </div>
        </div>
        <div class="chart-container">
            <h3>By Confidence Level</h3>
            ${renderConfidenceBreakdown()}
        </div>
        `;
    }

    function renderConfidenceBreakdown() {
        const conf = { high: { w: 0, l: 0 }, med: { w: 0, l: 0 }, low: { w: 0, l: 0 } };
        for (const day of PICKS_DATA) {
            for (const pick of day.picks) {
                if (pick.result === "win") conf[pick.confidence].w++;
                else if (pick.result === "loss") conf[pick.confidence].l++;
            }
        }

        return ["high", "med", "low"].map(level => {
            const total = conf[level].w + conf[level].l;
            const pct = total > 0 ? ((conf[level].w / total) * 100).toFixed(0) : 0;
            return `
            <div class="chart-bar-container">
                <div class="chart-label">${level.charAt(0).toUpperCase() + level.slice(1)}</div>
                <div class="chart-bar-bg"><div class="chart-bar green" style="width: ${pct}%"></div></div>
                <div class="chart-value">${conf[level].w}-${conf[level].l} (${pct}%)</div>
            </div>`;
        }).join("");
    }

    function renderStreaks() {
        // Build daily W/L timeline
        let html = '<div class="chart-container"><h3>Daily Results Timeline</h3>';

        for (const day of PICKS_DATA) {
            const dayWins = day.picks.filter(p => p.result === "win").length;
            const dayLosses = day.picks.filter(p => p.result === "loss").length;
            const dayTotal = dayWins + dayLosses;
            if (dayTotal === 0) continue;

            const pct = ((dayWins / dayTotal) * 100).toFixed(0);
            const dateLabel = new Date(day.date + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });

            html += `
            <div class="chart-bar-container">
                <div class="chart-label">${dateLabel}</div>
                <div class="chart-bar-bg"><div class="chart-bar ${parseInt(pct) >= 50 ? 'green' : 'red'}" style="width: ${pct}%"></div></div>
                <div class="chart-value">${dayWins}-${dayLosses}</div>
            </div>`;
        }

        html += "</div>";

        // Best/worst picks
        const teamRecords = {};
        for (const day of PICKS_DATA) {
            for (const pick of day.picks) {
                if (pick.result !== "win" && pick.result !== "loss") continue;
                const key = pick.type === "ml" ? pick.team : `${pick.type.toUpperCase()} (${pick.matchup})`;
                if (!teamRecords[key]) teamRecords[key] = { w: 0, l: 0 };
                if (pick.result === "win") teamRecords[key].w++;
                else teamRecords[key].l++;
            }
        }

        html += '<div class="chart-container"><h3>Team/Pick Performance</h3>';
        const sorted = Object.entries(teamRecords).sort((a, b) => {
            const aPct = a[1].w / (a[1].w + a[1].l);
            const bPct = b[1].w / (b[1].w + b[1].l);
            return bPct - aPct;
        });

        for (const [team, rec] of sorted.slice(0, 10)) {
            const total = rec.w + rec.l;
            const pct = ((rec.w / total) * 100).toFixed(0);
            html += `
            <div class="chart-bar-container">
                <div class="chart-label" style="width:150px;font-size:0.8em">${team}</div>
                <div class="chart-bar-bg"><div class="chart-bar ${parseInt(pct) >= 50 ? 'green' : 'red'}" style="width: ${pct}%"></div></div>
                <div class="chart-value">${rec.w}-${rec.l}</div>
            </div>`;
        }
        html += "</div>";

        document.getElementById("tab-streaks").innerHTML = html;
    }

    function switchTab(tab) {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
        document.querySelector(`[onclick="switchTab('${tab}')"]`).classList.add("active");
        document.getElementById(`tab-${tab}`).classList.add("active");
    }

    // Refresh results from live MLB scores
    async function refreshResults() {
        const btn = document.getElementById('refresh-btn');
        btn.textContent = 'Refreshing...';
        btn.disabled = true;

        try {
            for (const day of PICKS_DATA) {
                const hasPending = day.picks.some(p => p.result === 'pending');
                if (!hasPending) continue;

                const res = await fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${day.date}&hydrate=linescore`);
                const data = await res.json();
                const games = (data.dates?.[0]?.games || []).filter(g => g.status.detailedState.includes('Final'));

                if (games.length === 0) continue;

                for (const pick of day.picks) {
                    if (pick.result !== 'pending') continue;

                    for (const game of games) {
                        const home = game.teams.home.team.name;
                        const away = game.teams.away.team.name;
                        const homeScore = game.teams.home.score;
                        const awayScore = game.teams.away.score;
                        const total = homeScore + awayScore;
                        const winner = homeScore > awayScore ? home : away;
                        const matchupStr = pick.matchup.toUpperCase();

                        // Check if this game matches the pick's matchup
                        const homeAbbr = home.split(' ').pop().toUpperCase().slice(0, 3);
                        const awayAbbr = away.split(' ').pop().toUpperCase().slice(0, 3);
                        const matchesGame = matchupStr.includes(homeAbbr.slice(0, 2)) || matchupStr.includes(awayAbbr.slice(0, 2)) ||
                            home.toLowerCase().includes(pick.matchup.split('@')[1]?.trim().split(' ')[0]?.toLowerCase() || '___') ||
                            away.toLowerCase().includes(pick.matchup.split('@')[0]?.trim().split(' ')[0]?.toLowerCase() || '___');

                        if (!matchesGame) continue;

                        const score = `${away.split(' ').pop()} ${awayScore}, ${home.split(' ').pop()} ${homeScore}`;

                        if (pick.type === 'ml') {
                            const pickedTeam = pick.team.toLowerCase();
                            const won = winner.toLowerCase().includes(pickedTeam.split(' ').pop()) ||
                                        pickedTeam.includes(winner.split(' ').pop().toLowerCase());
                            pick.result = won ? 'win' : 'loss';
                            pick.score = score;
                        } else if (pick.type === 'over') {
                            const lineMatch = pick.line.match(/([\d.]+)/);
                            if (lineMatch) {
                                const line = parseFloat(lineMatch[1]);
                                pick.result = total > line ? 'win' : total === line ? 'push' : 'loss';
                                pick.score = `${score} (${total} total)`;
                            }
                        } else if (pick.type === 'under') {
                            const lineMatch = pick.line.match(/([\d.]+)/);
                            if (lineMatch) {
                                const line = parseFloat(lineMatch[1]);
                                pick.result = total < line ? 'win' : total === line ? 'push' : 'loss';
                                pick.score = `${score} (${total} total)`;
                            }
                        }
                        break;
                    }
                }
            }

            // Re-render everything
            renderStats();
            renderDaily();
            renderPerformance();
            renderStreaks();
            btn.textContent = '✓ Updated';
            setTimeout(() => { btn.textContent = 'Refresh Results'; btn.disabled = false; }, 3000);
        } catch (e) {
            btn.textContent = 'Error - Try Again';
            btn.disabled = false;
            console.error('Refresh failed:', e);
        }
    }

    // Initial render
    renderStats();
    renderDaily();
    renderPerformance();
    renderStreaks();
    </script>
</body>
</html>
