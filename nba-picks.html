<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1117;color:#e1e4e8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.6;padding:20px}

.nav-links{text-align:center;margin-top:24px;padding-top:16px;border-top:1px solid #21262d}

</head>
<body>
<div class="container">
<header>
<h1>NBA Picks &amp; Props</h1>

</header>

<div class="section">

<script>
// ============================================================
// DAILY GAMES — Dynamic with collapsible projections & props
// ============================================================

function renderDailyGames(nbaData) {
  const container = document.getElementById('nba-daily-games');
  if (!nbaData || nbaData.length === 0) {
    container.innerHTML = '<p style="color:#8b949e;text-align:center;padding:20px">No NBA games today</p>';
    return;
  }

  let html = '';
  nbaData.forEach((game, idx) => {
    const gameId = (game.home || '').replace(/[^a-zA-Z]/g, '') + idx;
    const projections = game.projections || [];
    const propPicks = game.propPicks || [];

    html += `
    <div class="game-card" style="border-color:#f0883e" data-nba-game="${game.home}">
      <div class="game-header">
        <div class="game-matchup">${game.away} (${game.awayRecord || '?'}) @ ${game.home} (${game.homeRecord || '?'})</div>
        <div class="game-time">${game.status || ''}</div>
      </div>
      <div class="game-details">
        <div class="detail-item"><div class="detail-label">Spread</div><div class="detail-value">${game.spread || 'N/A'}</div></div>
        <div class="detail-item"><div class="detail-label">O/U</div><div class="detail-value">${game.ou || 'N/A'}</div></div>
        ${game.homeML ? `<div class="detail-item"><div class="detail-label">Moneyline</div><div class="detail-value orange">${game.home} ${game.homeML} / ${game.away} ${game.awayML}</div></div>` : ''}
        ${game.series ? `<div class="detail-item"><div class="detail-label">Series</div><div class="detail-value">${game.series}</div></div>` : ''}
      </div>`;

    // Collapsible Projections
    if (projections.length > 0) {
      html += `
      <div class="nba-day-section" style="margin-top:14px" id="proj-${gameId}">
        <div class="nba-day-header" onclick="document.getElementById('proj-${gameId}').classList.toggle('collapsed')" style="padding:10px 16px">
          <h3 style="color:#d2a8ff">&#128202; Player Projections (${projections.length})</h3>
          <span class="chevron">&#9660;</span>
        </div>
        <div class="nba-day-body" style="padding:0">
          <table class="nba-picks-table">
            <thead><tr><th>Player</th><th>Team</th><th>Pos</th><th>Proj PTS</th><th>Proj REB</th><th>Proj AST</th><th>PRA</th></tr></thead>
            <tbody>
              ${projections.map(p => `<tr><td style="font-weight:600">${p.name}</td><td>${p.team}</td><td>${p.pos || ''}</td><td>${p.projPts}</td><td>${p.projReb}</td><td>${p.projAst}</td><td style="font-weight:700;color:#d2a8ff">${p.pra}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
    }

    // Collapsible Props
    if (propPicks.length > 0) {
      html += `
      <div class="nba-day-section" style="margin-top:8px" id="props-${gameId}">
        <div class="nba-day-header" onclick="document.getElementById('props-${gameId}').classList.toggle('collapsed')" style="padding:10px 16px">
          <h3 style="color:#f0883e">&#127942; Prop Picks (${propPicks.length})</h3>
          <span class="chevron">&#9660;</span>
        </div>
        <div class="nba-day-body" style="padding:0">
          <table class="nba-picks-table">
            <thead><tr><th>Player</th><th>Team</th><th>Stat</th><th>Pick</th><th>Line</th><th>Projected</th><th>Edge</th><th>Conf</th></tr></thead>
            <tbody>
              ${propPicks.map(p => {
                const edgeColor = p.edge > 0 ? '#3fb950' : '#f85149';
                const confColor = p.confidence === 'HIGH' ? '#3fb950' : p.confidence === 'MED' ? '#d29922' : '#8b949e';
                const confBg = p.confidence === 'HIGH' ? '#1a4023' : p.confidence === 'MED' ? '#2d2a1f' : '#21262d';
                return `<tr>
                  <td style="font-weight:600">${p.name}</td>
                  <td>${p.team}</td>
                  <td>${p.stat}</td>
                  <td style="font-weight:600;color:${edgeColor}">${p.direction}</td>
                  <td>${p.line}</td>
                  <td style="font-weight:700;color:#58a6ff">${p.projected}</td>
                  <td style="color:${edgeColor};font-weight:600">${p.edge > 0 ? '+' : ''}${p.edge}</td>
                  <td><span style="background:${confBg};color:${confColor};padding:2px 7px;border-radius:4px;font-size:0.75em;font-weight:600">${p.confidence}</span></td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
    }

    html += `</div>`;
  });

  container.innerHTML = html;
}

function renderParlays(nbaData) {
  const container = document.getElementById('nba-parlays');
  if (!nbaData || nbaData.length === 0) { container.innerHTML = ''; return; }

  // Build parlays from high/med confidence props across games
  const allProps = [];
  for (const game of nbaData) {
    for (const prop of (game.propPicks || [])) {
      if (prop.confidence === 'HIGH' || prop.confidence === 'MED') {
        allProps.push({ ...prop, game: `${game.away} @ ${game.home}` });
      }
    }
  }

  if (allProps.length < 2) { container.innerHTML = ''; return; }

  // Sort by edge and build 2-3 parlays
  allProps.sort((a, b) => b.absEdge - a.absEdge);
  const parlays = [];

  // 2-leg parlay: top 2 props
  if (allProps.length >= 2) {
    const legs = allProps.slice(0, 2);
    const impliedProb = legs.reduce((p, l) => p * 0.6, 1); // ~60% each leg
    const payout = (1 / impliedProb).toFixed(1);
    parlays.push({ name: '2-Leg Power Play', legs, payout: `+${Math.round((payout - 1) * 100)}`, impliedOdds: `${(impliedProb * 100).toFixed(0)}%` });
  }

  // 3-leg parlay: top 3
  if (allProps.length >= 3) {
    const legs = allProps.slice(0, 3);
    const impliedProb = legs.reduce((p, l) => p * 0.58, 1);
    const payout = (1 / impliedProb).toFixed(1);
    parlays.push({ name: '3-Leg Value Parlay', legs, payout: `+${Math.round((payout - 1) * 100)}`, impliedOdds: `${(impliedProb * 100).toFixed(0)}%` });
  }

  // 4-leg long shot: mix stats
  if (allProps.length >= 4) {
    // Pick diverse stats: 1 PTS, 1 REB/AST, 1 PRA, 1 other
    const byType = {};
    for (const p of allProps) { if (!byType[p.stat]) byType[p.stat] = p; }
    const diverse = Object.values(byType).slice(0, 4);
    if (diverse.length >= 4) {
      const impliedProb = diverse.reduce((p, l) => p * 0.55, 1);
      const payout = (1 / impliedProb).toFixed(1);
      parlays.push({ name: '4-Leg Long Shot', legs: diverse, payout: `+${Math.round((payout - 1) * 100)}`, impliedOdds: `${(impliedProb * 100).toFixed(0)}%` });
    }
  }

  let html = `
  <div class="nba-day-section" style="margin-top:20px" id="parlays-section">
    <div class="nba-day-header" onclick="document.getElementById('parlays-section').classList.toggle('collapsed')" style="padding:12px 16px;background:#1a2332">
      <h3 style="color:#58a6ff">&#127922; Today's Parlays (${parlays.length})</h3>
      <span class="chevron">&#9660;</span>
    </div>
    <div class="nba-day-body" style="padding:16px">`;

  for (const parlay of parlays) {
    html += `
      <div style="background:#0d1117;border:1px solid #21262d;border-radius:8px;padding:14px;margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <span style="font-weight:700;color:#58a6ff">${parlay.name}</span>
          <span style="background:#1f3a5f;color:#58a6ff;padding:4px 10px;border-radius:4px;font-weight:700;font-size:0.9em">${parlay.payout}</span>
        </div>
        <div style="font-size:0.8em;color:#8b949e;margin-bottom:8px">Est. probability: ${parlay.impliedOdds}</div>
        ${parlay.legs.map((leg, i) => `
        <div style="display:flex;align-items:center;gap:8px;padding:6px 0;${i > 0 ? 'border-top:1px solid #21262d' : ''}">
          <span style="color:#f0883e;font-weight:600;width:18px">${i+1}.</span>
          <span style="font-weight:600">${leg.name}</span>
          <span style="color:#8b949e">${leg.stat}</span>
          <span style="color:${leg.edge > 0 ? '#3fb950' : '#f85149'};font-weight:600">${leg.direction} ${leg.line}</span>
          <span style="color:#8b949e;font-size:0.85em;margin-left:auto">edge: ${leg.edge > 0 ? '+' : ''}${leg.edge}</span>
        </div>`).join('')}
      </div>`;
  }

  html += `</div></div>`;
  container.innerHTML = html;
}

async function loadDailyGames() {
  try {
    const res = await fetch('/api/today');
    if (res.ok) {
      const data = await res.json();
      const subtitle = document.getElementById('page-subtitle');
      if (subtitle && data.date) {
        const d = new Date(data.date + 'T12:00:00');
        subtitle.textContent = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
      }
      renderDailyGames(data.nba || []);
      renderParlays(data.nba || []);
    } else {
      document.getElementById('nba-daily-games').innerHTML = '<p style="color:#8b949e;text-align:center;padding:20px">No predictions yet today &mdash; run generates at 7am ET</p>';
    }
  } catch (e) {
    document.getElementById('nba-daily-games').innerHTML = '<p style="color:#f85149;text-align:center;padding:20px">Failed to load daily games</p>';
  }
}

async function refreshNBA() {
  const btn = document.getElementById('nba-refresh-btn');
  if (!btn) return;
  btn.textContent = 'Refreshing...';
  btn.disabled = true;
  try {
    const res = await fetch('/api/today');
    const data = res.ok ? await res.json() : null;
    const today = data?.date?.replace(/-/g, '') || new Date().toISOString().slice(0, 10).replace(/-/g, '');

    const scoreRes = await fetch('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=' + today);
    const scoreData = await scoreRes.json();
    const events = scoreData.events || [];

    for (const event of events) {
      const comp = event.competitions[0];
      const home = comp.competitors?.find(c => c.homeAway === 'home');
      const away = comp.competitors?.find(c => c.homeAway === 'away');
      if (!home || !away) continue;

      const homeScore = parseInt(home.score || 0);
      const awayScore = parseInt(away.score || 0);
      const isFinal = comp.status?.type?.completed;

      if (!isFinal) continue;

      const gameCard = document.querySelector(`[data-nba-game="${home.team.displayName}"]`);
      if (!gameCard) continue;

      const timeEl = gameCard.querySelector('.game-time');
      if (timeEl) timeEl.innerHTML = `<span style="color:#3fb950;font-weight:600">Final: ${away.team.shortDisplayName} ${awayScore}, ${home.team.shortDisplayName} ${homeScore}</span>`;
    }

    btn.textContent = '✓ Updated';
    setTimeout(() => { btn.textContent = 'Refresh Results'; btn.disabled = false; }, 3000);
  } catch (e) {
    console.error('NBA refresh:', e);
    btn.textContent = 'Error';
    btn.disabled = false;
  }
}

// ============================================================
// NBA BEST BETS TRACKER
// ============================================================

let NBA_TRACKER_DATA = [
    {
        date: "2026-05-19",
        picks: [
            { type: "spread", team: "Cleveland Cavaliers", matchup: "CLE @ NYK", line: "CLE +7.5", odds: "-115", confidence: "high", thesis: "Playoff games run tight", result: "pending", score: "" },
            { type: "ml", team: "New York Knicks", matchup: "CLE @ NYK", line: "NYK -265", odds: "-265", confidence: "med", thesis: "Home court + better record", result: "pending", score: "" },
            { type: "over", team: "OVER 217.5", matchup: "CLE @ NYK", line: "O 217.5", odds: "-110", confidence: "med", thesis: "Competitive series = pace", result: "pending", score: "" },
            { type: "prop", team: "Jalen Brunson O 30.5 PRA", matchup: "CLE @ NYK", line: "O 30.5 (+2.3 edge)", odds: "-115", confidence: "med", thesis: "Avg 32.8 PRA", result: "pending", score: "" },
            { type: "prop", team: "Donovan Mitchell O 31.5 PRA", matchup: "CLE @ NYK", line: "O 31.5 (+2.1 edge)", odds: "-110", confidence: "med", thesis: "Avg 33.6 PRA", result: "pending", score: "" },
            { type: "prop", team: "Karl-Anthony Towns O 10.5 REB", matchup: "CLE @ NYK", line: "O 10.5 (+1.4 edge)", odds: "-120", confidence: "med", thesis: "Avg 11.9 RPG", result: "pending", score: "" }
        ]
    }
];

// Auto-grade all pending days on page load
async function autoGradePendingDays() {
    for (const day of NBA_TRACKER_DATA) {
        const hasPending = day.picks.some(p => p.result === 'pending');
        if (!hasPending) continue;

        try {
            const res = await fetch('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=' + day.date.replace(/-/g, ''));
            const data = await res.json();
            const events = data.events || [];

            for (const event of events) {
                const comp = event.competitions[0];
                const home = comp.competitors?.find(c => c.homeAway === 'home');
                const away = comp.competitors?.find(c => c.homeAway === 'away');
                if (!home || !away || !comp.status?.type?.completed) continue;

                const homeScore = parseInt(home.score || 0);
                const awayScore = parseInt(away.score || 0);
                const total = homeScore + awayScore;
                const margin = homeScore - awayScore;
                const winner = homeScore > awayScore ? home.team.displayName : away.team.displayName;
                const scoreStr = `${away.team.shortDisplayName} ${awayScore}, ${home.team.shortDisplayName} ${homeScore}`;

                for (const pick of day.picks) {
                    if (pick.result !== 'pending') continue;

                    if (pick.type === 'ml') {
                        const pickedTeam = pick.team.split(' ').slice(-1)[0].toLowerCase();
                        const won = winner.toLowerCase().includes(pickedTeam);
                        pick.result = won ? 'win' : 'loss';
                        pick.score = scoreStr;
                    } else if (pick.type === 'spread') {
                        const lineMatch = pick.line.match(/([+-]?\d+\.?\d*)/);
                        if (lineMatch) {
                            const spread = parseFloat(lineMatch[1]);
                            const pickedTeam = pick.team;
                            const isHome = home.team.displayName.includes(pickedTeam.split(' ').pop());
                            const teamMargin = isHome ? margin : -margin;
                            pick.result = (teamMargin + spread) > 0 ? 'win' : 'loss';
                            pick.score = scoreStr;
                        }
                    } else if (pick.type === 'over') {
                        const lineMatch = pick.line.match(/([\d.]+)/);
                        if (lineMatch) {
                            const line = parseFloat(lineMatch[1]);
                            pick.result = total > line ? 'win' : total === line ? 'push' : 'loss';
                            pick.score = `${scoreStr} (${total} total)`;
                        }
                    } else if (pick.type === 'under') {
                        const lineMatch = pick.line.match(/([\d.]+)/);
                        if (lineMatch) {
                            const line = parseFloat(lineMatch[1]);
                            pick.result = total < line ? 'win' : 'loss';
                            pick.score = `${scoreStr} (${total} total)`;
                        }
                    } else if (pick.type === 'prop') {
                        try {
                            const boxRes = await fetch('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=' + event.id);
                            const boxData = await boxRes.json();
                            const lineMatch = pick.line.match(/O\s*([\d.]+)/);
                            if (!lineMatch) continue;
                            const propLine = parseFloat(lineMatch[1]);
                            const playerName = pick.team.split(' O ')[0].split(' U ')[0];

                            for (const team of (boxData.boxscore?.players || [])) {
                                for (const stat of team.statistics) {
                                    const labels = stat.labels || [];
                                    const ptsIdx = labels.indexOf('PTS');
                                    const rebIdx = labels.indexOf('REB');
                                    const astIdx = labels.indexOf('AST');
                                    for (const athlete of stat.athletes) {
                                        if (!athlete.athlete.displayName.includes(playerName.split(' ').pop())) continue;
                                        const pts = parseInt(athlete.stats[ptsIdx]) || 0;
                                        const reb = parseInt(athlete.stats[rebIdx]) || 0;
                                        const ast = parseInt(athlete.stats[astIdx]) || 0;

                                        let actual = null;
                                        if (pick.team.includes('PRA')) actual = pts + reb + ast;
                                        else if (pick.team.includes('REB')) actual = reb;
                                        else if (pick.team.includes('AST')) actual = ast;
                                        else if (pick.team.includes('PTS')) actual = pts;

                                        if (actual !== null) {
                                            pick.result = actual > propLine ? 'win' : 'loss';
                                            pick.score = `${actual} actual`;
                                        }
                                    }
                                }
                            }
                        } catch (e) {}
                    }
                }
            }
        } catch (e) {}
    }
}

function calcNBAStats() {
    let wins = 0, losses = 0, pending = 0;
    let spreadW = 0, spreadT = 0, propW = 0, propT = 0;
    let streak = { type: null, count: 0 };

    for (const day of NBA_TRACKER_DATA) {
        for (const p of day.picks) {
            if (p.result === 'win') { wins++; }
            else if (p.result === 'loss') { losses++; }
            else { pending++; continue; }

            if (p.type === 'spread' || p.type === 'ml' || p.type === 'over' || p.type === 'under') {
                spreadT++; if (p.result === 'win') spreadW++;
            } else if (p.type === 'prop') {
                propT++; if (p.result === 'win') propW++;
            }
        }
    }

    const allResults = [];
    for (const day of NBA_TRACKER_DATA) {
        for (const p of day.picks) {
            if (p.result === 'win') allResults.push('W');
            else if (p.result === 'loss') allResults.push('L');
        }
    }
    for (const r of allResults) {
        if (!streak.type) { streak = { type: r, count: 1 }; }
        else if (r === streak.type) { streak.count++; }
        else break;
    }

    const total = wins + losses;
    return {
        wins, losses, pending,
        pct: total > 0 ? ((wins / total) * 100).toFixed(1) : '0.0',
        gameW: spreadW, gameT: spreadT,
        propW, propT,
        streak: streak.type ? `${streak.type}${streak.count}` : '—'
    };
}

function renderNBAStats() {
    const s = calcNBAStats();
    document.getElementById('nba-stats-banner').innerHTML = `
        <div class="nba-tracker-stat"><div class="val green">${s.wins}</div><div class="lbl">Wins</div></div>
        <div class="nba-tracker-stat"><div class="val red">${s.losses}</div><div class="lbl">Losses</div></div>
        <div class="nba-tracker-stat"><div class="val pct">${s.pct}%</div><div class="lbl">Win Rate</div></div>
        <div class="nba-tracker-stat"><div class="val">${s.gameW}-${s.gameT - s.gameW}</div><div class="lbl">Game Bets</div></div>
        <div class="nba-tracker-stat"><div class="val">${s.propW}-${s.propT - s.propW}</div><div class="lbl">Props</div></div>
        <div class="nba-tracker-stat"><div class="val" style="color:#f0883e">${s.streak}</div><div class="lbl">Streak</div></div>
    `;
}

function renderNBATracker() {
    let html = '';
    for (let i = 0; i < NBA_TRACKER_DATA.length; i++) {
        const day = NBA_TRACKER_DATA[i];
        const dayW = day.picks.filter(p => p.result === 'win').length;
        const dayL = day.picks.filter(p => p.result === 'loss').length;
        const dayP = day.picks.filter(p => p.result === 'pending').length;
        const collapsed = i > 0 ? 'collapsed' : '';

        const dateStr = new Date(day.date + 'T12:00:00').toLocaleDateString('en-US', {
            weekday: 'long', month: 'short', day: 'numeric', year: 'numeric'
        });

        html += `
        <div class="nba-day-section ${collapsed}" id="nba-day-${day.date}">
            <div class="nba-day-header" onclick="toggleNBADay('${day.date}')">
                <h3>${dateStr}</h3>
                <div class="record">
                    <span class="w">${dayW}W</span>
                    <span class="l">${dayL}L</span>
                    ${dayP > 0 ? `<span class="p">${dayP} pending</span>` : ''}
                    <span class="chevron">&#9660;</span>
                </div>
            </div>
            <div class="nba-day-body">
                <table class="nba-picks-table">
                    <thead><tr><th>Type</th><th>Pick</th><th>Matchup</th><th>Line</th><th>Thesis</th><th>Score</th><th>Result</th></tr></thead>
                    <tbody>
                        ${day.picks.map(p => `
                        <tr style="${p.result === 'win' ? 'background:#0d2818;border-left:4px solid #3fb950' : p.result === 'loss' ? 'background:#2d1215;border-left:4px solid #f85149' : 'border-left:4px solid transparent'}">
                            <td><span class="nba-pick-type ${p.type}">${p.type === 'ml' ? 'ML' : p.type.toUpperCase()}</span></td>
                            <td><strong>${p.team}</strong></td>
                            <td>${p.matchup}</td>
                            <td>${p.line}</td>
                            <td style="color:#8b949e;font-size:0.85em">${p.thesis}</td>
                            <td>${p.score || '—'}</td>
                            <td><span class="nba-result-badge ${p.result}">${p.result === 'win' ? '✓ WIN' : p.result === 'loss' ? '✗ LOSS' : 'PENDING'}</span></td>
                        </tr>`).join('')}
                    </tbody>
                </table>
            </div>
        </div>`;
    }
    document.getElementById('nba-tracker-days').innerHTML = html;
}

function toggleNBADay(date) {
    document.getElementById(`nba-day-${date}`).classList.toggle('collapsed');
}

async function refreshTrackerResults() {
    const btn = document.getElementById('nba-tracker-refresh');
    btn.textContent = 'Refreshing...';
    btn.disabled = true;

    try {
        for (const day of NBA_TRACKER_DATA) {
            const hasPending = day.picks.some(p => p.result === 'pending');
            if (!hasPending) continue;

            const res = await fetch('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=' + day.date.replace(/-/g, ''));
            const data = await res.json();
            const events = data.events || [];

            for (const event of events) {
                const comp = event.competitions[0];
                const home = comp.competitors?.find(c => c.homeAway === 'home');
                const away = comp.competitors?.find(c => c.homeAway === 'away');
                if (!home || !away || !comp.status?.type?.completed) continue;

                const homeScore = parseInt(home.score || 0);
                const awayScore = parseInt(away.score || 0);
                const total = homeScore + awayScore;
                const margin = homeScore - awayScore;
                const winner = homeScore > awayScore ? home.team.displayName : away.team.displayName;
                const scoreStr = `${away.team.shortDisplayName} ${awayScore}, ${home.team.shortDisplayName} ${homeScore}`;

                for (const pick of day.picks) {
                    if (pick.result !== 'pending') continue;

                    if (pick.type === 'ml') {
                        const pickedTeam = pick.team.split(' ').slice(-1)[0].toLowerCase();
                        const won = winner.toLowerCase().includes(pickedTeam);
                        pick.result = won ? 'win' : 'loss';
                        pick.score = scoreStr;
                    } else if (pick.type === 'spread') {
                        const pickedTeam = pick.team;
                        const lineMatch = pick.line.match(/([+-]?\d+\.?\d*)/);
                        if (lineMatch) {
                            const spread = parseFloat(lineMatch[1]);
                            const isHome = home.team.displayName.includes(pickedTeam.split(' ').pop());
                            const teamMargin = isHome ? margin : -margin;
                            pick.result = (teamMargin + spread) > 0 ? 'win' : 'loss';
                            pick.score = scoreStr;
                        }
                    } else if (pick.type === 'over') {
                        const lineMatch = pick.line.match(/([\d.]+)/);
                        if (lineMatch) {
                            const line = parseFloat(lineMatch[1]);
                            pick.result = total > line ? 'win' : total === line ? 'push' : 'loss';
                            pick.score = `${scoreStr} (${total} total)`;
                        }
                    } else if (pick.type === 'under') {
                        const lineMatch = pick.line.match(/([\d.]+)/);
                        if (lineMatch) {
                            const line = parseFloat(lineMatch[1]);
                            pick.result = total < line ? 'win' : 'loss';
                            pick.score = `${scoreStr} (${total} total)`;
                        }
                    } else if (pick.type === 'prop') {
                        try {
                            const boxRes = await fetch('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=' + event.id);
                            const boxData = await boxRes.json();
                            const lineMatch = pick.line.match(/O\s*([\d.]+)/);
                            if (!lineMatch) continue;
                            const propLine = parseFloat(lineMatch[1]);
                            const playerName = pick.team.split(' O ')[0].split(' U ')[0];

                            for (const team of (boxData.boxscore?.players || [])) {
                                for (const stat of team.statistics) {
                                    const labels = stat.labels || [];
                                    const ptsIdx = labels.indexOf('PTS');
                                    const rebIdx = labels.indexOf('REB');
                                    const astIdx = labels.indexOf('AST');
                                    for (const athlete of stat.athletes) {
                                        if (!athlete.athlete.displayName.includes(playerName.split(' ').pop())) continue;
                                        const pts = parseInt(athlete.stats[ptsIdx]) || 0;
                                        const reb = parseInt(athlete.stats[rebIdx]) || 0;
                                        const ast = parseInt(athlete.stats[astIdx]) || 0;

                                        let actual = null;
                                        if (pick.team.includes('PRA')) actual = pts + reb + ast;
                                        else if (pick.team.includes('REB')) actual = reb;
                                        else if (pick.team.includes('AST')) actual = ast;
                                        else if (pick.team.includes('PTS')) actual = pts;

                                        if (actual !== null) {
                                            pick.result = actual > propLine ? 'win' : 'loss';
                                            pick.score = `${actual} actual`;
                                        }
                                    }
                                }
                            }
                        } catch (e) {}
                    }
                }
            }
        }

        renderNBAStats();
        renderNBATracker();
        btn.textContent = '✓ Updated';
        setTimeout(() => { btn.textContent = 'Refresh Results'; btn.disabled = false; }, 3000);
    } catch (e) {
        console.error('NBA tracker refresh:', e);
        btn.textContent = 'Error';
        btn.disabled = false;
    }
}

async function loadNBATracker() {
    // Add today's picks from API if not already in tracker
    try {
        const todayRes = await fetch('/api/today');
        if (todayRes.ok) {
            const todayData = await todayRes.json();
            const todayDate = todayData.date;
            const existingDates = new Set(NBA_TRACKER_DATA.map(d => d.date));

            if (todayDate && !existingDates.has(todayDate) && todayData.nba?.length > 0) {
                const todayPicks = [];
                for (const game of todayData.nba) {
                    // Add game bets
                    if (game.spread) {
                        const favHome = game.spread && !game.spread.includes('+');
                        const dog = favHome ? game.away : game.home;
                        const spreadVal = game.spread.match(/([+-]?\d+\.?\d*)/)?.[1] || '0';
                        todayPicks.push({ type: 'spread', team: dog, matchup: `${(game.awayAbbrev||game.away.split(' ').pop())} @ ${(game.homeAbbrev||game.home.split(' ').pop())}`, line: `${dog.split(' ').pop()} +${Math.abs(parseFloat(spreadVal))}`, odds: '-110', confidence: 'med', thesis: 'Playoff games run tight', result: 'pending', score: '' });
                    }
                    if (game.ou) {
                        todayPicks.push({ type: 'over', team: `OVER ${game.ou}`, matchup: `${(game.awayAbbrev||game.away.split(' ').pop())} @ ${(game.homeAbbrev||game.home.split(' ').pop())}`, line: `O ${game.ou}`, odds: '-110', confidence: 'med', thesis: 'Pace projection', result: 'pending', score: '' });
                    }
                    // Add top prop picks
                    if (game.propPicks) {
                        for (const prop of game.propPicks.slice(0, 5)) {
                            todayPicks.push({
                                type: 'prop',
                                team: `${prop.name} ${prop.direction} ${prop.line} ${prop.stat}`,
                                matchup: `${(game.awayAbbrev||game.away.split(' ').pop())} @ ${(game.homeAbbrev||game.home.split(' ').pop())}`,
                                line: `${prop.direction === 'OVER' ? 'O' : 'U'} ${prop.line} (${prop.edge > 0 ? '+' : ''}${prop.edge} edge)`,
                                odds: '-110',
                                confidence: prop.confidence?.toLowerCase() || 'med',
                                thesis: `Avg ${prop.seasonAvg} → Proj ${prop.projected}`,
                                result: 'pending',
                                score: '',
                            });
                        }
                    }
                }
                if (todayPicks.length > 0) {
                    NBA_TRACKER_DATA.unshift({ date: todayDate, picks: todayPicks });
                }
            }
        }
    } catch (e) {}

    // Merge any additional history days from API
    try {
        const res = await fetch('/api/nba-bestbets');
        if (res.ok) {
            const data = await res.json();
            if (data.days && data.days.length > 0) {
                const existingDates = new Set(NBA_TRACKER_DATA.map(d => d.date));
                for (const day of data.days) {
                    if (!existingDates.has(day.date)) {
                        NBA_TRACKER_DATA.push(day);
                    }
                }
            }
        }
    } catch (e) {}

    NBA_TRACKER_DATA.sort((a, b) => b.date.localeCompare(a.date));

    // Auto-grade any pending results from completed games
    await autoGradePendingDays();

    renderNBAStats();
    renderNBATracker();
}

// Boot
loadDailyGames();
loadNBATracker();
