<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NBA Picks & Props</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1117;color:#e1e4e8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.6;padding:20px}
.container{max-width:1200px;margin:0 auto}
header{text-align:center;padding:20px 0 16px;border-bottom:1px solid #21262d;margin-bottom:24px}
header h1{font-size:2em;background:linear-gradient(135deg,#f0883e,#d2a8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
header .subtitle{color:#8b949e;font-size:1em}
.section{margin-bottom:30px}
.section-title{font-size:1.3em;color:#f0883e;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid #21262d;display:flex;justify-content:space-between;align-items:center}
.game-card{background:#161b22;border:1px solid #21262d;border-radius:12px;padding:18px;margin-bottom:12px}
.game-card.graded-win{border-color:#34d399;background:rgba(52,211,153,0.05)}
.game-card.graded-loss{border-color:#f87171;background:rgba(248,113,113,0.05)}
.game-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.game-matchup{font-size:1.1em;font-weight:600}
.game-time{color:#8b949e;font-size:0.85em}
.game-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.detail-label{font-size:0.7em;color:#8b949e;text-transform:uppercase}
.detail-value{font-weight:600;margin-top:2px}
.detail-value.green{color:#3fb950}
.detail-value.orange{color:#f0883e}
.table-wrapper{overflow-x:auto;border-radius:8px;border:1px solid #21262d;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:0.85em;min-width:600px}
th{text-align:left;padding:8px 10px;background:#161b22;border-bottom:2px solid #21262d;color:#8b949e;font-size:0.75em;text-transform:uppercase;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #1a1f2e;white-space:nowrap}
tr:hover td{background:rgba(240,136,62,0.03)}
tr.row-win td{background:rgba(52,211,153,0.06);border-left:3px solid #34d399}
tr.row-loss td{background:rgba(248,113,113,0.06);border-left:3px solid #f87171}
.badge-win{background:#064e3b;color:#34d399;padding:2px 8px;border-radius:4px;font-size:0.8em;font-weight:700}
.badge-loss{background:#7f1d1d;color:#f87171;padding:2px 8px;border-radius:4px;font-size:0.8em;font-weight:700}
.badge-pend{background:#78350f;color:#f59e0b;padding:2px 8px;border-radius:4px;font-size:0.8em;font-weight:700}
.stats-banner{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:#161b22;border:1px solid #21262d;border-radius:10px;padding:16px;text-align:center}
.stat-card .value{font-size:1.8em;font-weight:700}
.stat-card .label{font-size:0.8em;color:#8b949e;margin-top:4px}
.day-section{background:#161b22;border:1px solid #21262d;border-radius:10px;margin-bottom:12px;overflow:hidden}
.day-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#1c2128;cursor:pointer;user-select:none}
.day-header:hover{background:#22272e}
.day-header .chevron{color:#8b949e;transition:transform 0.2s}
.day-section.collapsed .chevron{transform:rotate(-90deg)}
.day-section.collapsed .day-body{display:none}
.day-body{overflow-x:auto;-webkit-overflow-scrolling:touch}
.btn{padding:6px 14px;border:none;border-radius:6px;font-size:0.75em;font-weight:600;cursor:pointer}
.btn-orange{background:#f0883e;color:#fff}
.btn-purple{background:#d2a8ff;color:#0f1117}
.btn:disabled{background:#374151;color:#6b7280;cursor:not-allowed}
.nav-links{text-align:center;margin-top:24px;padding-top:16px;border-top:1px solid #21262d}
.nav-links a{color:#58a6ff;text-decoration:none;margin:0 12px;font-size:0.9em}
footer{text-align:center;padding:20px 0;color:#6e7681;font-size:0.8em;border-top:1px solid #21262d;margin-top:30px}
.loading{text-align:center;padding:40px;color:#8b949e}
.empty{text-align:center;padding:40px;color:#6b7280}
</style>
</head>
<body>
<div class="container">
<header>
<h1>NBA Picks &amp; Props</h1>
<div class="subtitle" id="nba-date">Loading...</div>
</header>

<div class="section">
<div class="section-title"><span>Today's NBA Games</span><button class="btn btn-orange" id="refresh-btn" onclick="refreshAll()">Refresh Results</button></div>
<div id="today-games"><div class="loading">Loading...</div></div>
</div>

<div class="section">
<div class="section-title" style="color:#d2a8ff"><span>NBA Best Bets Tracker</span><button class="btn btn-purple" onclick="refreshAll()">Refresh</button></div>
<div class="stats-banner" id="nba-stats"></div>
<div id="tracker-days"><div class="loading">Loading...</div></div>
</div>

<div class="nav-links">
<a href="/">Daily Picks</a>
<a href="/early">Early Action</a>
<a href="/tracker">Betting Tracker</a>
<a href="/mlb">MLB Season</a>
</div>

<footer>Data: ESPN Scoreboard + Box Scores | Props graded live via Refresh</footer>
</div>

<script>
let todayData = null;
let trackerData = null;

async function loadAll() {
  try {
    const [todayRes, trackerRes] = await Promise.all([
      fetch('/api/today'),
      fetch('/api/nba-bestbets')
    ]);
    todayData = await todayRes.json();
    trackerData = await trackerRes.json();

    if (todayData.date) {
      const d = new Date(todayData.date + 'T12:00:00');
      document.getElementById('nba-date').textContent = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    }

    renderTodayGames();
    renderTracker();
  } catch (e) {
    document.getElementById('today-games').innerHTML = '<div class="loading">Failed to load data.</div>';
  }
}

function renderTodayGames() {
  const container = document.getElementById('today-games');
  const nba = todayData?.nba || [];

  if (nba.length === 0) {
    container.innerHTML = '<div class="empty">No NBA games today.</div>';
    return;
  }

  let html = '';
  const hasTomorrow = nba.some(g => g.isTomorrow);
  if (hasTomorrow) {
    html += '<div class="tomorrow-banner" style="background:#2d1f00;border:1px solid #f0883e;border-radius:8px;padding:8px 14px;margin-bottom:12px;color:#f0883e;font-weight:600;font-size:0.9em">&#128197; Tomorrow\'s Game (no NBA today)</div>';
  }
  for (const game of nba) {
    html += '<div class="game-card" style="border-color:#f0883e">';
    html += '<div class="game-header"><div class="game-matchup">' + game.away + ' (' + (game.awayRecord || '') + ') @ ' + game.home + ' (' + (game.homeRecord || '') + ')</div>';
    html += '<div class="game-time">' + (game.isTomorrow ? 'TOMORROW — ' : '') + (game.time || '') + '</div></div>';
    html += '<div class="game-details">';
    html += '<div><div class="detail-label">Spread</div><div class="detail-value">' + game.home + ' ' + game.spread + '</div></div>';
    html += '<div><div class="detail-label">O/U</div><div class="detail-value">' + game.ou + '</div></div>';
    html += '<div><div class="detail-label">Moneyline</div><div class="detail-value orange">' + game.home + ' ' + game.homeML + ' / ' + game.away + ' ' + game.awayML + '</div></div>';
    html += '<div><div class="detail-label">Records</div><div class="detail-value">' + (game.homeHomeRecord ? 'Home: ' + game.homeHomeRecord : '') + (game.awayRoadRecord ? ' | Road: ' + game.awayRoadRecord : '') + '</div></div>';
    html += '</div></div>';
  }
  container.innerHTML = html;
}

function renderTracker() {
  const days = trackerData?.days || [];

  // Stats
  let totalW = 0, totalL = 0, totalPend = 0;
  for (const d of days) {
    for (const p of d.picks) {
      if (p.result === 'win') totalW++;
      else if (p.result === 'loss') totalL++;
      else totalPend++;
    }
  }
  const pct = (totalW + totalL) > 0 ? ((totalW / (totalW + totalL)) * 100).toFixed(1) : '0';

  document.getElementById('nba-stats').innerHTML =
    '<div class="stat-card"><div class="value" style="color:#3fb950">' + totalW + '</div><div class="label">Wins</div></div>' +
    '<div class="stat-card"><div class="value" style="color:#f85149">' + totalL + '</div><div class="label">Losses</div></div>' +
    '<div class="stat-card"><div class="value" style="color:#d2a8ff">' + pct + '%</div><div class="label">Win Rate</div></div>' +
    '<div class="stat-card"><div class="value" style="color:#f59e0b">' + totalPend + '</div><div class="label">Pending</div></div>';

  // Days
  const container = document.getElementById('tracker-days');
  if (days.length === 0) {
    container.innerHTML = '<div class="empty">No NBA bets tracked yet.</div>';
    return;
  }

  let html = '';
  for (let i = 0; i < days.length; i++) {
    const day = days[i];
    const collapsed = i > 0 ? ' collapsed' : '';
    const dW = day.picks.filter(p => p.result === 'win').length;
    const dL = day.picks.filter(p => p.result === 'loss').length;
    const dP = day.picks.filter(p => p.result === 'pending').length;
    const dateLabel = new Date(day.date + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

    html += '<div class="day-section' + collapsed + '" id="nba-day-' + day.date + '">';
    html += '<div class="day-header" onclick="document.getElementById(\'nba-day-' + day.date + '\').classList.toggle(\'collapsed\')">';
    html += '<div style="display:flex;align-items:center;gap:10px"><h4 style="font-size:0.95em">' + dateLabel + '</h4></div>';
    html += '<div style="display:flex;align-items:center;gap:12px;font-size:0.85em"><span style="color:#3fb950;font-weight:600">' + dW + 'W</span> <span style="color:#f85149;font-weight:600">' + dL + 'L</span>' + (dP > 0 ? ' <span style="color:#f59e0b">' + dP + ' pend</span>' : '') + '<span class="chevron">&#9660;</span></div>';
    html += '</div>';

    html += '<div class="day-body"><table><thead><tr><th>Type</th><th>Pick</th><th>Line</th><th>Info</th><th>Score</th><th>Result</th></tr></thead><tbody>';

    for (const p of day.picks) {
      const rowCls = p.result === 'win' ? 'row-win' : p.result === 'loss' ? 'row-loss' : '';
      const badge = p.result === 'win' ? '<span class="badge-win">W</span>' : p.result === 'loss' ? '<span class="badge-loss">L</span>' : '<span class="badge-pend">PEND</span>';
      const typeBg = p.type === 'prop' ? '#2d2a1f;color:#f0883e' : p.type === 'spread' ? '#2d1f3d;color:#d2a8ff' : p.type === 'over' ? '#1a4023;color:#3fb950' : '#1f3a5f;color:#58a6ff';

      html += '<tr class="' + rowCls + '">';
      html += '<td><span style="background:' + typeBg + ';padding:2px 8px;border-radius:4px;font-size:0.78em;font-weight:600">' + p.type.toUpperCase() + '</span></td>';
      html += '<td style="font-weight:600">' + (p.team || '—') + '</td>';
      html += '<td>' + (p.line || '—') + '</td>';
      html += '<td style="color:#8b949e;font-size:0.85em">' + (p.thesis || p.matchup || '—') + '</td>';
      html += '<td style="color:#8b949e">' + (p.score || '—') + '</td>';
      html += '<td>' + badge + '</td>';
      html += '</tr>';
    }

    html += '</tbody></table></div></div>';
  }

  container.innerHTML = html;
}

async function refreshAll() {
  const btn = document.getElementById('refresh-btn');
  btn.textContent = 'Grading...'; btn.disabled = true;
  try {
    await fetch('/api/grade', { method: 'POST' });
    await loadAll();
    btn.textContent = 'Updated!';
    setTimeout(() => { btn.textContent = 'Refresh Results'; btn.disabled = false; }, 2000);
  } catch (e) {
    btn.textContent = 'Error';
    setTimeout(() => { btn.textContent = 'Refresh Results'; btn.disabled = false; }, 2000);
  }
}

loadAll();
</script>
</body>
</html>
