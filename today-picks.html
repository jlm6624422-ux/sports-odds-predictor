<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today's Picks</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1117;color:#e1e4e8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.6;padding:20px}
.container{max-width:1200px;margin:0 auto}
header{text-align:center;padding:20px 0 16px;margin-bottom:0}
header h1{font-size:2em;background:linear-gradient(135deg,#58a6ff,#3fb950);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
header .subtitle{color:#8b949e;font-size:1em}
header .model-badge{display:inline-block;background:rgba(63,185,80,0.15);color:#3fb950;padding:3px 10px;border-radius:20px;font-size:0.75em;font-weight:600;margin-top:6px}

.stats-bar{display:flex;justify-content:center;gap:24px;padding:12px 0;margin-bottom:16px;border-bottom:1px solid #21262d;flex-wrap:wrap}
.stat{text-align:center}
.stat .val{font-size:1.3em;font-weight:700;color:#3fb950}
.stat .val.blue{color:#58a6ff}
.stat .lbl{font-size:0.7em;color:#6b7280;text-transform:uppercase;letter-spacing:0.3px}

.tabs{display:flex;gap:0;border-bottom:2px solid #21262d;margin-bottom:24px;overflow-x:auto}
.tab{padding:12px 24px;cursor:pointer;color:#6b7280;font-weight:600;font-size:0.9em;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.2s;white-space:nowrap;user-select:none}
.tab:hover{color:#e1e4e8}
.tab.active{color:#58a6ff;border-bottom-color:#58a6ff}
.tab-content{display:none}
.tab-content.active{display:block}

.section{margin-bottom:30px}
.section-title{font-size:1.3em;color:#58a6ff;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid #21262d}
.section-title.nba{color:#f0883e}
.section-title.parlays{color:#a371f7}
.game-card{background:#161b22;border:1px solid #21262d;border-radius:12px;padding:18px;margin-bottom:12px}
.game-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.game-matchup{font-size:1.1em;font-weight:600}
.game-time{color:#8b949e;font-size:0.85em}
.game-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.detail-label{font-size:0.7em;color:#8b949e;text-transform:uppercase}
.detail-value{font-weight:600;margin-top:2px}
.detail-value.green{color:#3fb950}
.detail-value.orange{color:#f0883e}
.pick-item{background:#161b22;border:1px solid #21262d;border-radius:10px;padding:14px 18px;margin-bottom:8px;display:flex;align-items:center;gap:12px;border-left:3px solid #3fb950}
.pick-item.nba{border-left-color:#f0883e;background:rgba(240,136,62,0.05)}
.pick-item.kelly{border-left-color:#3fb950;background:rgba(63,185,80,0.05)}
.pick-item.over{border-left-color:#58a6ff;background:rgba(88,166,255,0.05)}
.pick-details{flex:1}
.pick-game{font-size:0.8em;color:#8b949e}
.pick-bet{font-weight:600;margin-top:2px}
.pick-edge{font-weight:700;color:#3fb950;font-size:0.9em;min-width:50px;text-align:right}
.pick-conf{padding:3px 8px;border-radius:4px;font-size:0.7em;font-weight:700}
.pick-conf.kelly{background:#064e3b;color:#34d399}
.pick-conf.high{background:#1f3a5f;color:#58a6ff}
.pick-conf.med{background:#2d2a1f;color:#d29922}
.table-wrapper{overflow-x:auto;border-radius:8px;border:1px solid #21262d}
table{width:100%;border-collapse:collapse;font-size:0.82em}
th{text-align:left;padding:8px 10px;background:#161b22;border-bottom:2px solid #21262d;color:#8b949e;font-size:0.75em;text-transform:uppercase}
td{padding:8px 10px;border-bottom:1px solid #1a1f2e}
td.edge-positive{color:#3fb950;font-weight:600}
td.edge-high{color:#f0883e;font-weight:700}
tr.skip td{color:#484f58}
.parlay-card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:18px;margin-bottom:10px;border-left:3px solid #a371f7}
.parlay-card.best{border-color:#3fb950;border-width:2px}
.parlay-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.parlay-type{font-weight:700;color:#a371f7;font-size:0.95em}
.parlay-odds{font-weight:700;font-size:1.2em}
.parlay-legs{color:#8b949e;font-size:0.85em;margin-bottom:6px}
.parlay-footer{display:flex;gap:16px;font-size:0.8em;color:#8b949e;flex-wrap:wrap}
.parlay-footer .ev{color:#3fb950;font-weight:600}
.nav-links{text-align:center;margin-top:24px;padding-top:16px;border-top:1px solid #21262d}
.nav-links a{color:#58a6ff;text-decoration:none;margin:0 12px;font-size:0.9em}
.nav-links a:hover{text-decoration:underline}
footer{text-align:center;padding:20px 0;color:#6e7681;font-size:0.8em;border-top:1px solid #21262d;margin-top:30px}
</style>
</head>
<body>
<div class="container">
<header>
<h1>Today's Picks</h1>
<div class="subtitle" id="page-date">Loading...</div>
<div class="model-badge">Ensemble v2.1 — Pythagorean + Elo + FIP + Market</div>
</header>

<div class="stats-bar" id="stats-bar"></div>

<div class="tabs">
<div class="tab active" onclick="switchTab('picks')">Picks</div>
<div class="tab" onclick="switchTab('projections')">Projections</div>
<div class="tab" onclick="switchTab('parlays')">Parlays</div>
</div>

<!-- PICKS TAB -->
<div class="tab-content active" id="tab-picks">
<div id="picks-content"><p style="color:#8b949e;text-align:center;padding:40px">Loading predictions...</p></div>
</div>

<!-- PROJECTIONS TAB -->
<div class="tab-content" id="tab-projections">
<div id="projections-content"></div>
</div>

<!-- PARLAYS TAB -->
<div class="tab-content" id="tab-parlays">
<div id="parlays-content"></div>
</div>

<div class="nav-links">
<a href="/mlb/today">MLB Today</a>
<a href="/nba">NBA</a>
<a href="/tracker">Betting Tracker</a>
<a href="/mlb">MLB Season</a>
</div>

<footer>
<p>Model: Ensemble v2.1 (Pythagorean + Elo + FIP + Market) | Data: ESPN/DraftKings + MLB Stats API</p>
<p style="margin-top:4px" id="gen-time"></p>
</footer>
</div>

<script>
function switchTab(name) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  event.target.classList.add('active');
}

function renderPicks(data) {
  const mlb = data.mlb || [];
  const nba = data.nba || [];
  const actionable = mlb.filter(g => g.kelly && g.kelly.betSize > 0);
  const leans = mlb.filter(g => !g.coinFlip && g.confidence !== 'coin-flip' && (!g.kelly || g.kelly.betSize === 0));

  let html = `<h2 style="margin-bottom:16px">&#127942; Today's Best Plays <button id="refresh-btn" onclick="refreshResults()" style="float:right;padding:6px 14px;background:#238636;color:#fff;border:none;border-radius:6px;font-size:0.75em;font-weight:600;cursor:pointer">Refresh Results</button></h2>`;

  // Kelly-sized bets
  for (const g of actionable) {
    const team = g.kelly.team;
    const odds = g.kelly.side === 'home' ? g.prediction.homeWinProb : g.prediction.awayWinProb;
    html += `<div class="pick-item kelly" data-team="${team}" data-type="ml" data-home="${g.home}">
      <div class="pick-details"><div class="pick-game">${g.away} @ ${g.home} &bull; Moneyline (Kelly)</div><div class="pick-bet">${team} ML &mdash; $${g.kelly.betSize}</div></div>
      <div class="pick-edge">+${Math.abs(g.edge?.home || g.edge?.away || 0).toFixed(1)}%</div>
      <span class="pick-conf kelly">KELLY</span><span class="pick-result" style="margin-left:8px"></span>
    </div>`;
  }

  // O/U picks with edge
  for (const g of mlb) {
    if (!g.ouLine || !g.totalEdge || Math.abs(g.totalEdge) < 1.5) continue;
    const dir = g.totalEdge > 0 ? 'OVER' : 'UNDER';
    html += `<div class="pick-item over" data-type="${dir.toLowerCase()}" data-line="${g.ouLine}" data-home="${g.home}">
      <div class="pick-details"><div class="pick-game">${g.away} @ ${g.home} &bull; Total</div><div class="pick-bet">${dir} ${g.ouLine} (-110) &mdash; Proj ${g.prediction.expectedTotal} runs</div></div>
      <div class="pick-edge">${g.totalEdge > 0 ? '+' : ''}${g.totalEdge}</div>
      <span class="pick-conf high">HIGH</span><span class="pick-result" style="margin-left:8px"></span>
    </div>`;
  }

  // NBA picks
  for (const game of nba) {
    if (!game.spread) continue;
    html += `<div class="pick-item nba">
      <div class="pick-details"><div class="pick-game">NBA: ${game.away} @ ${game.home} &bull; Game</div><div class="pick-bet">${game.spread} | O/U ${game.ou}</div></div>
      <div class="pick-edge" style="color:#f0883e">${game.propPicks?.length || 0} props</div>
      <span class="pick-conf med">NBA</span>
    </div>`;
  }

  // MLB leans
  for (const g of leans.slice(0, 5)) {
    const side = g.prediction.homeWinProb > g.prediction.awayWinProb ? 'home' : 'away';
    const team = side === 'home' ? g.home : g.away;
    html += `<div class="pick-item" data-team="${team}" data-type="ml" data-home="${g.home}">
      <div class="pick-details"><div class="pick-game">${g.away} @ ${g.home} &bull; Lean</div><div class="pick-bet">${team} ML</div></div>
      <div class="pick-edge">${Math.max(g.prediction.homeWinProb, g.prediction.awayWinProb).toFixed(1)}%</div>
      <span class="pick-conf med">LEAN</span><span class="pick-result" style="margin-left:8px"></span>
    </div>`;
  }

  document.getElementById('picks-content').innerHTML = html;
}

function renderProjections(data) {
  const mlb = data.mlb || [];
  const nba = data.nba || [];

  let html = `<div class="section"><div class="section-title">&#9918; MLB Full Projections &mdash; ${mlb.length} Games</div>
  <div class="table-wrapper"><table><thead><tr><th>Game</th><th>Pitchers</th><th>Pick</th><th>Win%</th><th>Conf</th><th>Proj Total</th><th>O/U Edge</th></tr></thead><tbody>`;

  const sorted = [...mlb].sort((a, b) => Math.max(b.prediction.homeWinProb, b.prediction.awayWinProb) - Math.max(a.prediction.homeWinProb, a.prediction.awayWinProb));

  for (const g of sorted) {
    const isCoin = g.confidence === 'coin-flip';
    const side = g.prediction.homeWinProb > g.prediction.awayWinProb ? g.home : g.away;
    const pct = Math.max(g.prediction.homeWinProb, g.prediction.awayWinProb);
    const ouEdge = g.totalEdge ? (g.totalEdge > 0 ? '+' : '') + g.totalEdge : '—';
    const confClass = g.confidence === 'high' ? 'edge-high' : g.confidence === 'medium' ? 'edge-positive' : '';

    html += `<tr class="${isCoin ? 'skip' : ''}">
      <td>${g.away.split(' ').pop()} @ ${g.home.split(' ').pop()}</td>
      <td>${g.awayPitcher || 'TBD'} vs ${g.homePitcher || 'TBD'}</td>
      <td class="${isCoin ? '' : 'edge-positive'}">${isCoin ? '—' : side.split(' ').pop()}</td>
      <td class="${isCoin ? '' : 'edge-positive'}">${pct.toFixed(1)}%</td>
      <td class="${confClass}">${g.confidence?.toUpperCase() || '—'}</td>
      <td>${g.prediction.expectedTotal}</td>
      <td class="${Math.abs(g.totalEdge || 0) >= 1.5 ? 'edge-positive' : ''}">${ouEdge}</td>
    </tr>`;
  }
  html += `</tbody></table></div></div>`;

  // NBA projections
  if (nba.length > 0) {
    html += `<div class="section"><div class="section-title nba">&#127936; NBA Player Projections</div>`;
    for (const game of nba) {
      if (!game.projections || game.projections.length === 0) continue;
      html += `<div class="game-card" style="border-color:#f0883e"><div class="game-header"><div class="game-matchup">${game.away} @ ${game.home}</div><div class="game-time">${game.status || ''}</div></div>
      <div class="table-wrapper" style="margin-top:12px"><table><thead><tr><th>Player</th><th>Team</th><th>Proj PTS</th><th>Proj REB</th><th>Proj AST</th><th>PRA</th></tr></thead><tbody>`;
      for (const p of game.projections) {
        html += `<tr><td style="font-weight:600">${p.name}</td><td>${p.team}</td><td>${p.projPts}</td><td>${p.projReb}</td><td>${p.projAst}</td><td style="font-weight:700;color:#d2a8ff">${p.pra}</td></tr>`;
      }
      html += `</tbody></table></div></div>`;
    }
    html += `</div>`;
  }

  document.getElementById('projections-content').innerHTML = html;
}

function renderParlays(data) {
  const mlb = data.mlb || [];
  const nba = data.nba || [];
  const actionable = mlb.filter(g => g.kelly && g.kelly.betSize > 0);

  let html = `<div class="section"><div class="section-title parlays">&#127922; Parlay Plays</div>`;

  const parlayLegs = [];
  for (const g of actionable) {
    parlayLegs.push({ name: g.kelly.team + ' ML', prob: (g.kelly.side === 'home' ? g.prediction.homeWinProb : g.prediction.awayWinProb) / 100 });
  }
  // Add top NBA props
  for (const game of nba) {
    if (game.propPicks) {
      for (const prop of game.propPicks.slice(0, 3)) {
        if (prop.confidence === 'HIGH' || prop.confidence === 'MED') {
          parlayLegs.push({ name: `${prop.name} ${prop.direction} ${prop.line} ${prop.stat}`, prob: 0.58 });
        }
      }
    }
  }

  if (parlayLegs.length >= 2) {
    // 2-leg safe
    const safe2 = parlayLegs.slice(0, 2);
    const safe2Prob = safe2.reduce((p, l) => p * l.prob, 1);
    const safe2Payout = (1 / safe2Prob).toFixed(2);
    html += `<div class="parlay-card best"><div class="parlay-header"><div class="parlay-type">&#9733; Parlay A &mdash; Safe 2-Leg</div><div class="parlay-odds" style="color:#3fb950">${safe2Payout}x</div></div>
      <div class="parlay-legs">${safe2.map(l => l.name).join(' + ')}</div>
      <div class="parlay-footer"><span>Win%: ${(safe2Prob * 100).toFixed(1)}%</span><span>Stake: $50</span><span>Payout: $${(50 * safe2Payout).toFixed(0)}</span></div></div>`;

    // 3-leg value
    if (parlayLegs.length >= 3) {
      const val3 = parlayLegs.slice(0, 3);
      const val3Prob = val3.reduce((p, l) => p * l.prob, 1);
      const val3Payout = (1 / val3Prob).toFixed(2);
      html += `<div class="parlay-card"><div class="parlay-header"><div class="parlay-type">Parlay B &mdash; 3-Leg Value</div><div class="parlay-odds" style="color:#f0883e">${val3Payout}x</div></div>
        <div class="parlay-legs">${val3.map(l => l.name).join(' + ')}</div>
        <div class="parlay-footer"><span>Win%: ${(val3Prob * 100).toFixed(1)}%</span><span>Stake: $30</span><span>Payout: $${(30 * val3Payout).toFixed(0)}</span></div></div>`;
    }

    // Cross-sport 4-leg
    if (parlayLegs.length >= 4) {
      const cross4 = [parlayLegs[0], parlayLegs[1], ...parlayLegs.slice(-2)];
      const cross4Prob = cross4.reduce((p, l) => p * l.prob, 1);
      const cross4Payout = (1 / cross4Prob).toFixed(2);
      html += `<div class="parlay-card"><div class="parlay-header"><div class="parlay-type">Parlay C &mdash; Cross-Sport 4-Leg</div><div class="parlay-odds" style="color:#f85149">${cross4Payout}x</div></div>
        <div class="parlay-legs">${cross4.map(l => l.name).join(' + ')}</div>
        <div class="parlay-footer"><span>Win%: ${(cross4Prob * 100).toFixed(1)}%</span><span>Stake: $20</span><span>Payout: $${(20 * cross4Payout).toFixed(0)}</span></div></div>`;
    }
  } else {
    html += `<p style="color:#8b949e">Not enough actionable bets for parlays today.</p>`;
  }

  html += `</div>`;
  document.getElementById('parlays-content').innerHTML = html;
}

function renderStats(data) {
  const mlb = data.mlb || [];
  const nba = data.nba || [];
  const actionable = mlb.filter(g => g.kelly && g.kelly.betSize > 0);
  const nbaProps = data.nbaProps || [];
  const exposure = actionable.reduce((s, g) => s + (g.kelly?.betSize || 0), 0);

  document.getElementById('stats-bar').innerHTML = `
    <div class="stat"><div class="val">${mlb.length}</div><div class="lbl">MLB Games</div></div>
    <div class="stat"><div class="val" style="color:#f0883e">${nba.length}</div><div class="lbl">NBA Games</div></div>
    <div class="stat"><div class="val blue">${actionable.length + nbaProps.length}</div><div class="lbl">Total Picks</div></div>
    <div class="stat"><div class="val">$${exposure.toFixed(0)}</div><div class="lbl">MLB Exposure</div></div>
  `;
}

async function refreshResults() {
  const btn = document.getElementById('refresh-btn');
  if (!btn) return;
  btn.textContent = 'Refreshing...';
  btn.disabled = true;
  try {
    const todayRes = await fetch('/api/today');
    const todayData = todayRes.ok ? await todayRes.json() : null;
    const today = todayData?.date || new Date().toISOString().slice(0, 10);

    const res = await fetch('https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=' + today + '&hydrate=linescore');
    const data = await res.json();
    const games = (data.dates?.[0]?.games || []).filter(g => g.status.detailedState.includes('Final'));

    const results = new Map();
    for (const g of games) {
      results.set(g.teams.home.team.name, {
        home: g.teams.home.team.name, away: g.teams.away.team.name,
        homeScore: g.teams.home.score, awayScore: g.teams.away.score,
        winner: g.teams.home.score > g.teams.away.score ? g.teams.home.team.name : g.teams.away.team.name,
        total: g.teams.home.score + g.teams.away.score
      });
    }

    document.querySelectorAll('.pick-item[data-home]').forEach(el => {
      const home = el.dataset.home;
      const type = el.dataset.type;
      const game = results.get(home);
      if (!game) return;

      const resultEl = el.querySelector('.pick-result');
      if (!resultEl) return;

      let won = false;
      let score = game.away.split(' ').pop() + ' ' + game.awayScore + ', ' + game.home.split(' ').pop() + ' ' + game.homeScore;

      if (type === 'ml') {
        const team = el.dataset.team;
        won = game.winner.includes(team.split(' ').pop()) || team.includes(game.winner.split(' ').pop());
      } else if (type === 'over') {
        const line = parseFloat(el.dataset.line);
        won = game.total > line;
        score += ' (' + game.total + ' total)';
      } else if (type === 'under') {
        const line = parseFloat(el.dataset.line);
        won = game.total < line;
        score += ' (' + game.total + ' total)';
      }

      const badge = won
        ? '<span style="background:#064e3b;color:#34d399;padding:3px 10px;border-radius:4px;font-size:0.8em;font-weight:700">W</span>'
        : '<span style="background:#7f1d1d;color:#f87171;padding:3px 10px;border-radius:4px;font-size:0.8em;font-weight:700">L</span>';
      resultEl.innerHTML = badge + ' <span style="color:#8b949e;font-size:0.75em;margin-left:4px">' + score + '</span>';
    });

    btn.textContent = '✓ Updated';
    setTimeout(() => { btn.textContent = 'Refresh Results'; btn.disabled = false; }, 3000);
  } catch(e) {
    btn.textContent = 'Error';
    btn.disabled = false;
  }
}

async function loadPage() {
  try {
    const res = await fetch('/api/today');
    if (!res.ok) {
      document.getElementById('picks-content').innerHTML = '<p style="color:#8b949e;text-align:center;padding:40px">No predictions yet today &mdash; generates at 7am ET</p>';
      return;
    }
    const data = await res.json();

    // Update header
    if (data.date) {
      const d = new Date(data.date + 'T12:00:00');
      document.getElementById('page-date').textContent = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
      document.title = "Today's Picks - " + data.date;
    }
    document.getElementById('gen-time').textContent = 'Generated ' + (data.generatedAt || '');

    renderStats(data);
    renderPicks(data);
    renderProjections(data);
    renderParlays(data);
  } catch (e) {
    document.getElementById('picks-content').innerHTML = '<p style="color:#f85149;text-align:center;padding:40px">Failed to load predictions</p>';
  }
}

loadPage();
</script>
</body>
</html>
